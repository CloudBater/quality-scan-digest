name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install jsonschema
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install . && qsd --version

  # On a pull request: say what the merge will do (tag, skip, or refuse), without creating anything.
  tag-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 .github/scripts/auto_tag.py --check

  # After a push to main whose tests passed: tag the version in src/qsd/__init__.py as vX.Y.Z
  # when that tag does not exist yet. Needs write access to contents, which the workflow
  # default (read) does not grant; nothing else in this file has it.
  tag:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: auto-tag
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # the token is handed to the script's `git push` only
      - run: python3 .github/scripts/auto_tag.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
