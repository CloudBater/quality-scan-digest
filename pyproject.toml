[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quality-scan-digest"
dynamic = ["version"]
description = "Run SonarQube, Snyk, Trivy, Semgrep, Dependabot, OSV-Scanner, zizmor, Gitleaks, ClamAV and GuardDog, deduplicate across them, and export one JSON report."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/CloudBater/quality-scan-digest"
Issues = "https://github.com/CloudBater/quality-scan-digest/issues"

[project.scripts]
qsd = "qsd.cli:main"

[tool.setuptools.dynamic]
version = { attr = "qsd.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qsd = ["data/*.yml"]
