# Throwaway SonarQube Community Build for one scan run. `qsd scan` starts it,
# analyses each project, exports the results and runs `down -v`, so nothing
# is left running or holding data.
#
# Host prerequisite on Linux (not namespaced, cannot be set per container):
#   sysctl -w vm.max_map_count=524288
# Docker Desktop already satisfies it.

services:
  db:
    # Pinned by digest: `postgres:17` is a rolling tag.
    image: postgres@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
    environment:
      POSTGRES_USER: sonarqube
      POSTGRES_DB: sonarqube
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?set SONAR_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sonarqube -d sonarqube']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  sonarqube:
    # 26.8.0.126808-community, pinned by digest for the same reason.
    image: sonarqube@sha256:9dfc19385a3b7647e7585013d8c94ae2322228c6b217a1c641199f07f86b12ab
    depends_on:
      db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonarqube
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?set SONAR_DB_PASSWORD}
      # SonarSource's small-scale sizing (4 GB / 2 cores); raise for large codebases.
      SONAR_WEB_JAVAOPTS: '-Xmx1g -Xms256m'
      SONAR_CE_JAVAOPTS: '-Xmx2g -Xms512m'
      SONAR_SEARCH_JAVAOPTS: '-Xmx2g -Xms2g'
    ports:
      # Loopback only: the scanner joins the compose network, and only this
      # machine needs the API.
      - '127.0.0.1:${QSD_SONAR_PORT:-9000}:9000'
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  postgres_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
